<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Queridinha da Praia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="faixa">Moda feminina inspirada no litoral</div>
    <header>
        <a href="index.html">
            <img src="imagens/logo-horizontal.png" alt="Queridinha da Praia">
        </a>
        <input type="checkbox" id="abrir-menu">
        <label class="hamburguer" for="abrir-menu">☰</label>
        <nav>
            <a href="index.html#inicio">Início</a>
            <a href="index.html#colecoes">Coleções</a>
            <a href="index.html#roupas">Roupas</a>
            <a href="index.html#acessorios">Acessórios</a>
            <a href="sacola.html">Sacola</a>
            <a href="conta.html">Entrar</a>
            <a href="index.html#contato">Instagram</a>
        </nav>
    </header>
    <main>
        <section class="pagina">
            <h1>Criar uma conta</h1>
            <p>Preencha seus dados para criar uma conta.</p>
            <form action="resultado.html">
                <label for="nome">Nome completo</label>
                <input id="nome" type="text" placeholder="Seu nome" required>
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="Seu e-mail" required>
                <label for="senha">Senha</label>
                <input id="senha" type="password" placeholder="Crie uma senha" required>
                <button class="botao" type="submit">Cadastrar</button>
            </form>
            <p>Já tem uma conta? <a class="link" href="conta.html">Entrar</a>.</p>

        </section>
    </main>
    <footer>
        <p>Queridinha da Praia</p>
        <p>João Pessoa - PB e Natal - RN</p>
    </footer>
</body>
</html>
